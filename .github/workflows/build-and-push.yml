name: Build and Push to GHCR

on:
  push:
    branches:
      - prod
      - preprod
    tags:
      - "v*"
  pull_request:
    branches:
      - prod

permissions:
  contents: read
  packages: write

env:
  ENV: ${{ github.ref == 'refs/heads/preprod' && 'preprod' || 'prod' }}

jobs:
  versions:
    name: Versions
    uses: ./.github/workflows/versions.yml

  build-and-push:
    name: Build and push ${{ matrix.name }}
    needs: versions
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ fromJSON(needs.versions.outputs.env).DOCKER_REGISTRY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: docker/Dockerfile
            target: frankenphp_release
            args: |
              PHP_EXTENSIONS=${{ fromJSON(needs.versions.outputs.env).PHP_EXTENSIONS }}
              SESSION_LIFETIME=${{ fromJSON(needs.versions.outputs.env).SESSION_LIFETIME }}
              USER=${{ fromJSON(needs.versions.outputs.env).PROJECT_NAME }}
              USER_ID=${{ fromJSON(needs.versions.outputs.env).PROJECT_USER_ID }}
              GROUP_ID=${{ fromJSON(needs.versions.outputs.env).PROJECT_GROUP_ID }}
              RELEASE_APP_CONFIG_ENV=prod
              RELEASE_VERSION=${{ github.ref_name }}
          - name: frontend
            file: docker/frontend/Dockerfile
            target: ""
            args: ""
          - name: ml
            file: docker/ml/Dockerfile
            target: ml_release
            args: |
              USER=${{ fromJSON(needs.versions.outputs.env).PROJECT_NAME }}
              USER_ID=${{ fromJSON(needs.versions.outputs.env).PROJECT_USER_ID }}
              GROUP_ID=${{ fromJSON(needs.versions.outputs.env).PROJECT_GROUP_ID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.name }}/${{ env.ENV }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=ref,event=tag

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: |
            ${{ needs.versions.outputs.build-args }}
            ${{ matrix.args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
