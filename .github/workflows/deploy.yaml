name: Promote to prod

# The server pulls :prod itself (docker/deploy/pull-deploy.sh): no way in to the server lives here.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to promote, e.g. v0.3
        required: true

permissions:
  contents: read
  packages: write

jobs:
  versions:
    name: Versions
    uses: ./.github/workflows/versions.yml

  promote:
    name: Promote ${{ inputs.version }}
    needs: versions
    runs-on: ubuntu-latest
    environment: prod
    concurrency: prod
    env:
      REGISTRY: ${{ fromJSON(needs.versions.outputs.env).DOCKER_REGISTRY }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Check the version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::${VERSION} is not a release tag"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the release as prod
        run: |
          for service in api frontend ml; do
            # Copies the manifest as is: by default buildx wraps it in a new index with another digest.
            docker buildx imagetools create --prefer-index=false \
              --tag "${REGISTRY}/${service}/prod:prod" \
              "${REGISTRY}/${service}/prod:${VERSION}"
          done
