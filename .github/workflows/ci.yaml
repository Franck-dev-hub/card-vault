name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: read

jobs:
  versions:
    name: Versions
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/versions.yml

  backend:
    name: Backend
    needs: versions
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/franck-dev-hub/ci/php:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image user cannot write to the runner's workspace.
      options: --user root
    services:
      database:
        image: postgres:${{ fromJSON(needs.versions.outputs.env).POSTGRES_VERSION }}-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      APP_DEBUG: 1
      DEFAULT_URI: http://localhost
      DATABASE_URL: postgresql://app:app@database:5432/app?serverVersion=${{ fromJSON(needs.versions.outputs.env).POSTGRES_VERSION }}&charset=utf8
      COMPOSER_ALLOW_SUPERUSER: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Infection diffs against the base branch.
          fetch-depth: 0

      # git refuses a workspace owned by another user.
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install
        run: castor setup:backend

      - name: Lint
        run: castor lint:backend

      - name: Security audit
        run: castor security:backend

      - name: Tests
        run: castor tests:backend

      - name: Mutation testing on changed lines
        run: castor tests:backend:infection --diff-base=origin/${{ github.base_ref }}

  frontend:
    name: Frontend
    needs: versions
    runs-on: ubuntu-latest
    container:
      image: node:${{ fromJSON(needs.versions.outputs.env).NODEJS_VERSION }}-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0
        with:
          version: v${{ fromJSON(needs.versions.outputs.env).CASTOR_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@${{ fromJSON(needs.versions.outputs.env).PNPM_VERSION }}

      - name: Install
        run: castor setup:frontend

      - name: Lint
        run: castor lint:frontend

      - name: Security audit
        run: castor security:frontend

      - name: Tests
        run: castor tests:frontend

  ml:
    name: Machine learning
    needs: versions
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ fromJSON(needs.versions.outputs.env).UV_VERSION }}
          python-version: ${{ fromJSON(needs.versions.outputs.env).PYTHON_VERSION }}
          # Leaves the 10 GB repo cache to the image builds.
          enable-cache: false

      - uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0
        with:
          version: v${{ fromJSON(needs.versions.outputs.env).CASTOR_VERSION }}

      - name: Install
        run: castor setup:ml

      - name: Lint
        run: castor lint:ml

      - name: Security audit
        run: castor security:ml

      - name: Tests
        run: castor tests:ml

  docker:
    name: Docker build (${{ matrix.name }})
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: docker/Dockerfile
            target: frankenphp_release
          - name: frontend
            file: docker/frontend/Dockerfile
            target: ""
          - name: ml
            file: docker/ml/Dockerfile
            target: ml_release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ needs.versions.outputs.build-args }}
          push: false
          # Scoped per image, or both entries overwrite the same cache.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  e2e:
    name: E2E (Playwright)
    needs: versions
    runs-on: ubuntu-latest
    if: github.base_ref == 'prod'
    env:
      # E2E needs the whole Docker stack.
      CASTOR_RUNTIME: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0
        with:
          version: v${{ fromJSON(needs.versions.outputs.env).CASTOR_VERSION }}

      - name: Prepare environment
        run: castor setup:env

      # GH runner uid 1001 vs image user uid 1000: align mount ownership
      - name: Align source permissions with the container user
        run: sudo chown -R 1000:1000 apps

      - name: Build Playwright image
        run: docker compose -f docker/compose.yaml -f docker/compose.ci.yaml --env-file .env --env-file .env.local --profile e2e build playwright

      - name: Run E2E
        run: castor tests:e2e
