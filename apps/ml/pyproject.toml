[project]
name = "ml-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "datasets>=4.5.0",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.128.0",
    "mypy>=2.3.0",
    "numpy>=2.5.3",
    "ruff==0.16.9",
    "torchvision>=0.24.1",
    "transformers>=4.57.6",
    "types-requests>=2.33.0.20260712",
    "uvicorn>=0.40.0",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Conflicts with ruff format.
    "CPY001", # LICENSE at the root covers every file.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # pytest asserts with assert.
    "PLR2004", # Expected values are literals.
    "SLF001", # Tests set up private state.
    "ARG001", # Fixtures are requested by name.
    "D1", # The test name says what it checks.
]
"*.pyi" = [
    "ANN401", # Untyped libraries return Any.
    "D1", # Stubs mirror an API documented upstream.
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = ".:stubs"
untyped_calls_exclude = ["transformers"]

[tool.pytest.ini_options]
pythonpath = ["."]
