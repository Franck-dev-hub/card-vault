name: CI images

# A PR changing the image still runs on the previous one until merged.
on:
  push:
    branches:
      - develop
    paths:
      - .env
      - docker/Dockerfile
      - docker/compose.ci.yaml
      - docker/php/**
      - .github/workflows/ci-images.yml
      - .github/workflows/versions.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  versions:
    name: Versions
    uses: ./.github/workflows/versions.yml

  php:
    name: Build and push ci/php
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0
        with:
          version: v${{ fromJSON(needs.versions.outputs.env).CASTOR_VERSION }}

      - name: Prepare environment
        run: castor setup:env

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: docker compose -f docker/compose.yaml -f docker/compose.ci.yaml --env-file .env --env-file .env.local build php

      - name: Push
        run: docker compose -f docker/compose.yaml -f docker/compose.ci.yaml --env-file .env --env-file .env.local push php
