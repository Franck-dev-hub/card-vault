# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    session: true
    http_client:
        scoped_clients:
            scryfall.client:
                base_uri: 'https://api.scryfall.com/'
                headers:
                    Accept: 'application/json'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
