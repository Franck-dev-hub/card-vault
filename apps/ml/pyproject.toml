[project]
name = "ml-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bandit>=1.8.0",
    "datasets>=4.5.0",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.128.0",
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "numpy>=1.26.4,<2.0.0",
    "pandas>=2.1.1,<2.2.0",
    "ruff>=0.15.21,<0.16",
    "torchvision>=0.24.1",
    "transformers>=4.57.6",
    "types-requests>=2.33.0.20260712",
    "uvicorn>=0.40.0",
]

[tool.ruff]
line-length = 79

[tool.mypy]
explicit_package_bases = true
mypy_path = ".:stubs"

[tool.pytest.ini_options]
pythonpath = ["."]
