name: ${PROJECT_NAME:?error}

services:
  caddy:
    image: caddy:${CADDY_VERSION:?error}
    ports:
      - "80:80"
    volumes:
      - ./caddy/proxy.dev.Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: frankenphp_dev
      args:
        NODEJS_VERSION: ${NODEJS_VERSION:?error}
        PHP_VERSION: ${PHP_VERSION:?error}
        FRANKENPHP_VERSION: ${FRANKENPHP_VERSION:?error}
        COMPOSER_VERSION: ${COMPOSER_VERSION:?error}
        PHP_EXTENSIONS: ${PHP_EXTENSIONS:?error}
        SESSION_LIFETIME: ${SESSION_LIFETIME:?error}
        USER: ${PROJECT_NAME:?error}
        USER_ID: ${PROJECT_USER_ID:?error}
        GROUP_ID: ${PROJECT_GROUP_ID:?error}
    hostname: api
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      DATABASE_URL: postgresql://${POSTGRES_USER:?error}:${POSTGRES_PASSWORD:?error}@database:5432/${POSTGRES_DB:?error}?serverVersion=${POSTGRES_VERSION:?error}&charset=utf8
      REDIS_URL: redis://redis:6379
      SESSION_LIFETIME: ${SESSION_LIFETIME:?error}
      CADDY_ROOT_FOLDER: /home/${PROJECT_NAME:?error}/sources/api/public
      CADDY_CORS_ORIGIN: ${PROJECT_DOMAIN:?error}
      CONTAINER_USER: ${PROJECT_NAME:?error}
      MAILER_DSN: smtp://mailsink:1025
      XDEBUG_MODE: ${XDEBUG_MODE:-debug}
      XDEBUG_CONFIG: >-
        client_host=host.docker.internal
        client_port=9003
      PHP_IDE_CONFIG: serverName=${PROJECT_NAME:?error}
    volumes: !reset
      - ../apps:/home/${PROJECT_NAME:?error}/sources
      - ./caddy/api.Caddyfile:/etc/frankenphp/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: node:${NODEJS_VERSION:?error}-alpine
    build: !reset
    working_dir: /app
    user: "${PROJECT_USER_ID:?error}:${PROJECT_GROUP_ID:?error}"
    command: ["sh", "-c", "corepack pnpm install && corepack pnpm start"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../apps/frontend:/app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:4200 >/dev/null 2>&1 || exit 1"]
      start_period: 180s
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  ml:
    image: python:${PYTHON_VERSION:?error}-slim
    build: !reset
    working_dir: /app
    command: ["sh", "-c", "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 5000 --reload"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ../apps/ml:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/ml/health')"]
      start_period: 180s
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy

  database:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  mailsink:
    image: axllent/mailpit:latest
    restart: unless-stopped
    hostname: mailsink
    ports:
      - "8025:8025"
      - "1025:1025"

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@${PROJECT_DOMAIN:?error}}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?error}
    ports:
      - "5050:80"
    depends_on:
      database:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  database_data:
  redis_data:
  api_var:
  caddy_data:
  caddy_config:
  redisinsight_data:
