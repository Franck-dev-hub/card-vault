framework:
    cache:
        prefix_seed: cardvault/api

        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_CACHE_URL)%'

        pools:
            cache.api:
                adapter: cache.app
                default_lifetime: 604800   # 7 days

when@test:
    framework:
        cache:
            app: cache.adapter.array
            pools:
                cache.api:
                    adapter: cache.adapter.array
